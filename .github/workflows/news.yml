name: News Ingestion

on:
  schedule:
    # GitHub Actions cron usa UTC. Argentina es UTC-3 (sin horario de verano):
    # 06:00, 09:00, 12:00, 15:00, 18:00 y 21:00 America/Argentina/Buenos_Aires.
    - cron: '0 9,12,15,18,21 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ingest-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Ingest news
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: node scripts/news-ingest.js
