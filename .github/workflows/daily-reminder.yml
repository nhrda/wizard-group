name: Daily Reminder Email

on:
  schedule:
    # 8:00 AM hora Argentina = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch: # permite ejecutarlo manualmente para probar

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run reminder script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          EMAILJS_TO_EMAIL_1: ${{ secrets.EMAILJS_TO_EMAIL_1 }}
          EMAILJS_TO_EMAIL_2: ${{ secrets.EMAILJS_TO_EMAIL_2 }}
        run: node scripts/daily-reminder.js
